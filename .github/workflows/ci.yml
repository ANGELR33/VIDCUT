name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_secrets.py

  remotion:
    name: Remotion (typecheck y bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias Remotion
        run: npm install
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Construir composición Remotion
        run: npm run bundle

  tests:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas unitarias (bloqueantes)
        run: python -m unittest tests.test_relevance tests.test_run_log tests.test_tooling tests.test_broll_sync tests.test_editorial tests.test_filler_hook tests.test_rights tests.test_refiner_embeddings tests.test_edit_director tests.test_audio_mixer tests.test_reframe tests.test_motion_cards tests.test_animations tests.test_remotion_bridge tests.test_visual_scene_engine tests.test_narrative_motion -v
      - name: Prueba local de render (informativa)
        continue-on-error: true
        run: python -m unittest tests.test_local_pipeline -v
